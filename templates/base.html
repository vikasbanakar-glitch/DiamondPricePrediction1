<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diamond Price Predictor</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">

            <a class="navbar-brand fw-bold" href="/">
              <img src="{{ url_for('static', filename='images/diamond_logo.jpeg') }}" 
         width="35" class="me-2">

                💎 Diamond Predictor
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarNav" aria-controls="navbarNav"
                aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">

                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/">Home</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="/predict">Prediction</a>
                    </li>

                    <!-- 🌙 Dark / Light Theme Toggle -->
                    <li class="nav-item">
                        <button id="themeToggle" class="btn btn-outline-light btn-sm ms-3">🌙</button>
                    </li>
                </ul>

            </div>
        </div>
    </nav>

    <!-- MAIN CONTENT -->
    <main class="container py-4">
        {% block content %}
        {% endblock %}
    </main>

    <!-- FOOTER -->
    <footer class="text-center py-3 mt-auto bg-dark text-light">
        <p class="mb-0">© 2025 Diamond Price Predictor | All Rights Reserved</p>
    </footer>

    <!-- Bootstrap Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- DARK MODE TOGGLE SCRIPT -->
    <script>
        const toggleBtn = document.getElementById("themeToggle");

        toggleBtn.onclick = () => {
            document.body.classList.toggle("dark-mode");

            toggleBtn.textContent =
                document.body.classList.contains("dark-mode") ? "🌞" : "🌙";

            // Save theme in browser
            if (document.body.classList.contains("dark-mode")) {
                localStorage.setItem("theme", "dark");
            } else {
                localStorage.setItem("theme", "light");
            }
        };

        // Load saved theme
        window.onload = () => {
            if (localStorage.getItem("theme") === "dark") {
                document.body.classList.add("dark-mode");
                toggleBtn.textContent = "🌞";
            }
        };
    </script>

</body>
</html>
